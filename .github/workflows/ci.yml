          just test-compose-only "$dir" commit::e_17_the_test_user_approves_work_s_pushed_request_on_the_approval_surface
          just test-compose-only "$dir" commit::e_17_the_approval_return_hands_back_the_contribution_access_confirmed_once
          just test-compose-only "$dir" commit::t_101_with_the_contribution_work_s_pep_gets_the_exercise_and_its_receipt
          just test-compose-only "$dir" commit::e_17_work_server_writes_nothing_for_an_intent_access_did_not_approve
          just test-compose-only "$dir" commit::p_13_work_server_writes_nothing_for_a_capacity_the_exercise_does_not_carry
