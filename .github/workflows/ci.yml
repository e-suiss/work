          body=$'old 0\n\nwork.localhost/ledger/00\n1\n47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=\n\n\342\200\224 work.localhost AAAAAAAA\n'
          test "$(curl -s -o /dev/null -w '%{http_code}' --data-binary "$body" http://127.0.0.1:7390/add-checkpoint)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' --data-binary 'old 0' http://127.0.0.1:7390/add-checkpoint)" = 400
