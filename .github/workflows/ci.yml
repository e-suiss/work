          curl -fsS http://127.0.0.1:8191/metrics | grep -qx 'work_access_event_stream_up 1'
      - name: Access pushes api_client.updated for Work's client, which raises a signal; a domain lease being handed over answers 503 lease-held and is asked again (T-102)
        run: |
