          curl -fsS http://127.0.0.1:8191/metrics | grep -qx 'work_dependency_up{dependency="access"} 1'
          curl -fsS http://127.0.0.1:8191/metrics | grep -q '^work_dependency_up{dependency="relay"} [01]$'
          c logs work-server | grep -q 'relay.discovered\|relay.unreachable'
          c logs work-server | grep 'access.discovered' | grep -q 'https://access-server:8443/realms/platform'
          for _ in $(seq 1 60); do c logs work-server | grep -q 'ledger_time.roughtime_round' && break; sleep 1; done
          c logs work-server | grep 'ledger_time.roughtime_round' | grep -q '3'
          if c logs work-server | grep -q 'ledger_time.roughtime_unreachable'; then exit 1; fi
          c logs work-signer | grep -q 'serving on /run/work-signer/signer.sock, lockdown'
          c logs work-server | grep 'parser.workers_started' | grep -q '"workers":2'
          test "$(c logs work-server 2>&1 | grep -c 'work-server parser-worker: serving, lockdown')" -ge 2
      - name: work-server pairs with every tenant realm over its PEP certificate and keeps the stream Access opened (T-101, T-103)
        run: |
          c() { docker compose -f deploy/compose/compose.yaml "$@"; }
          q() { c exec -T -e PGPASSWORD=local-only-not-a-secret work-postgres psql -h 127.0.0.1 -U work_app -d work -tA "$@"; }
          for _ in $(seq 1 180); do c logs work-server | grep 'access.pairing_ran' | grep -q '"paired":[1-9]' && break; sleep 1; done
          c logs work-server | grep 'access.pairing_ran' | grep '"paired":[1-9]'
          c logs work-server | grep -q 'access.pep_loaded'
          c logs work-server | grep -q 'inbound.listening'
          q -c "select tenant, slug, state, refusal_code, failed_runs from work.access_realm order by tenant, slug"
          test "$(q -c "select count(*) from work.access_realm where state = 'paired' and party is not null and instance is not null and kid is not null and paired_at is not null")" -ge 1
          test "$(q -c "select count(*) from work.access_event_stream where stream_id is not null and state = 'enabled'")" = 1
          curl -fsS http://127.0.0.1:8191/metrics | grep -qx 'work_access_unpaired_realms 0'
