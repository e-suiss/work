# T-40, T-37, T-55, T-41, T-43
name: CI

on:
  push:
    branches: [main, "wip/**"]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # T-36
  SQLX_OFFLINE: "true"

jobs:
  fast:
    name: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # T-47
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: lint
      # T-60
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/xtask-cooldown-cache.json
          key: xtask-cooldown-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'packages/*/package-lock.json', '.github/**/*.yml') }}
          restore-keys: |
            xtask-cooldown-
      - name: Format (T-33)
        run: just fmt-check
      - name: Clippy, warnings are errors (T-33)
        run: just lint
      - name: Repository rules (T-31, T-36, T-46, T-52, T-60)
        env:
          XTASK_ONLINE: "1"
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$CATALOG_BASE" || "$CATALOG_BASE" =~ ^0+$ ]]; then
            CATALOG_BASE="$(git merge-base HEAD origin/main)"
          fi
          XTASK_CATALOG_BASE="$CATALOG_BASE" just rules
      - name: Record vectors regenerate byte for byte (P-11, P-72)
        id: vectors
        run: just vectors
      - name: Regenerate the record vectors
        if: failure() && steps.vectors.outcome == 'failure'
        run: just vectors-write
      - name: Upload the regenerated record vectors
        if: failure() && steps.vectors.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vectors
          path: conformance/vectors/records/
          retention-days: 7
          if-no-files-found: error
      - name: Install squawk 2.68.0 (T-52, T-60)
        env:
          SQUAWK_SHA256: 53070672cbe0b8adce55372931d4435cc2395edd8b5736819a82e483b08d4d09
        run: |
          curl -fsSL -o "$RUNNER_TEMP/squawk" \
            https://github.com/sbdchd/squawk/releases/download/v2.68.0/squawk-linux-x64
          echo "$SQUAWK_SHA256  $RUNNER_TEMP/squawk" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/squawk"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Migration safety (T-36)
        run: just squawk

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          tools: nextest
      - name: SoftHSM for the signer (T-56, T-72)
        run: |
          sudo apt-get update -q
          sudo apt-get install --yes --no-install-recommends softhsm2
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          printf 'directories.tokendir = %s\nobjectstore.backend = file\nlog.level = ERROR\n' \
            "$RUNNER_TEMP/softhsm/tokens" > "$RUNNER_TEMP/softhsm/softhsm2.conf"
          echo "SOFTHSM2_CONF=$RUNNER_TEMP/softhsm/softhsm2.conf" >> "$GITHUB_ENV"
      - name: Tests (T-37)
        env:
          NEXTEST_PROFILE: ci
        run: just test
      - name: Tests against real PostgreSQL 18 and NATS JetStream (T-36, T-37)
        env:
          NEXTEST_PROFILE: ci
        run: just test-containers
      - name: Fetch every locked crate for the offline metadata
        run: cargo fetch --locked
      - name: Every rule cites a passing test (T-46, T-47)
        env:
          XTASK_NEXTEST: "1"
        run: cargo xtask check rule-coverage
      - name: Seccomp kills reported by the kernel
        if: failure()
        run: sudo dmesg | grep -E 'type=1326|seccomp|landlock' || true

  sqlx:
    name: sqlx
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: sqlx
          targets: host
      - name: Install sqlx-cli 0.9.0, the pinned sqlx version (T-36, T-60)
        run: |
          if [[ "$(cargo sqlx --version 2>/dev/null || true)" != "sqlx-cli 0.9.0" ]]; then
            cargo install --locked sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls
          fi
      - name: Query database with every migration on PostgreSQL 18 (T-36)
        run: just sqlx-db
      - name: Committed query metadata in .sqlx matches the schema and the queries (T-36)
        id: check
        run: just sqlx-check
      - name: Regenerate the query metadata
        if: failure() && steps.check.outcome == 'failure'
        run: just sqlx-prepare
      - name: Upload the regenerated query metadata
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sqlx
          path: .sqlx/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # T-60 T-38
  lockfile:
    name: lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: lockfile
          targets: host
      - name: Cargo.lock resolves the manifests unchanged (T-60)
        id: check
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Resolve the changed manifests, keeping every locked version that still fits
        if: failure() && steps.check.outcome == 'failure'
        run: cargo update --workspace
      - name: Upload the resolved lock file
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lockfile
          path: Cargo.lock
          retention-days: 7
          if-no-files-found: error

  # T-58 T-60 T-38
  npm-lockfile:
    name: npm-lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Every package-lock.json installs its package.json unchanged (T-58, T-60)
        id: check
        run: |
          for dir in packages/*/; do
            test -f "$dir/package-lock.json"
            (cd "$dir" && npm ci --no-audit --no-fund)
          done
      - name: Resolve the changed manifests within the cooldown, keeping every locked version that still fits
        if: failure() && steps.check.outcome == 'failure'
        run: |
          for dir in packages/*/; do
            (cd "$dir" && npm install --package-lock-only --no-audit --no-fund)
          done
      - name: Upload the resolved lock files
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-lockfiles
          path: packages/*/package-lock.json
          retention-days: 7
          if-no-files-found: error

  # T-34 T-35 T-58 P-53
  api-client:
    name: api-client
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/api-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          # T-58
          cache-dependency-path: |
            packages/api-client/package-lock.json
      - name: Install (lockfile only, no install scripts; T-58, T-60)
        run: npm ci
      - name: npm vulnerability scan (T-38)
        run: npm audit --audit-level=high
      - name: The client regenerates byte for byte from the committed OpenAPI document (T-34, T-35)
        id: generated
        run: |
          npm run generate
          git status --porcelain -- src/generated
          test -z "$(git status --porcelain -- src/generated)"
      - name: Upload the regenerated client
        if: failure() && steps.generated.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-client
          path: packages/api-client/src/generated/
          retention-days: 7
          if-no-files-found: error
      - name: Lint, type check, format (T-34, T-58)
        run: |
          npm run lint
          npm run typecheck
          npm run format:check
      - name: The typed client against a local server (T-34, P-53)
        run: npm test

  # T-98 E-45 P-54
  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: contracts
          targets: host
      - name: OpenAPI and AsyncAPI documents regenerate byte for byte and every operation names one action (T-98, E-45)
        id: check
        run: |
          cargo xtask check openapi
          cargo xtask check asyncapi
      - name: Regenerate the contracts
        if: failure() && steps.check.outcome == 'failure'
        run: |
          cargo xtask openapi
          cargo xtask asyncapi
      - name: Upload the regenerated contracts
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contracts
          path: |
            sdks/openapi/
            sdks/asyncapi/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Lint the documents (T-98)
        run: |
          npx --yes @redocly/cli@2.69.0 lint --extends=minimal sdks/openapi/work-v1.json
          npx --yes @asyncapi/cli@6.2.1 validate sdks/asyncapi/work-events.yaml
          npx --yes @asyncapi/cli@6.2.1 validate sdks/asyncapi/work-live.yaml
      - name: No breaking change inside the major version (T-98, P-54)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git merge-base HEAD origin/main)"
          fi
          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          git archive "$BASE" sdks | tar -x -C "$base"
          if [[ -f "$base/sdks/openapi/work-v1.json" ]]; then
            docker run --rm -v "$base:/base:ro" -v "$PWD:/head:ro" tufin/oasdiff:v1.34.1@sha256:67a23cfea7d251e2ae34ee703ac8733c5d96bc2e7b90fd0f4d475ec99367b85f breaking /base/sdks/openapi/work-v1.json /head/sdks/openapi/work-v1.json --fail-on ERR
          fi
          if [[ -f "$base/sdks/asyncapi/work-events.yaml" ]]; then
            npx --yes @asyncapi/cli@6.2.1 diff "$base/sdks/asyncapi/work-events.yaml" sdks/asyncapi/work-events.yaml --format json --type breaking
          fi

  cddl:
    name: cddl
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/.github/cddl/Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: 4.0.7
          bundler-cache: true
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just@1.58.0
          fallback: none
      - name: Record vectors against the CDDL (P-11, P-72)
        run: |
          bundle exec cddl 2>&1 | grep -q 'version 0.12.14$'
          just cddl

  cross:
    name: cross
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: cross
      - name: Kernel no_std and WebAssembly builds (T-31, T-4)
        run: just cross

  kernel-bindings:
    name: kernel-bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: wasm
          tools: wasm-bindgen
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          # T-58
          cache-dependency-path: |
            packages/kernel/package-lock.json
      - name: Install (lockfile only, no install scripts; T-58, T-60)
        run: just web-install
      - name: npm vulnerability scan (T-38)
        run: just web-audit
      - name: Lint, type check, format, build (T-34, T-58)
        run: just web-check
      - name: Differential kernel vectors through WebAssembly (T-5, T-37)
        run: just web-test
      - name: Keep the WebAssembly build for the browser tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-wasm
          path: packages/kernel/wasm
          retention-days: 1
          if-no-files-found: error

  kernel-browser:
    name: kernel-browser
    needs: kernel-bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          # T-58
          cache-dependency-path: |
            packages/kernel/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kernel-wasm
          path: packages/kernel/wasm
      - name: Differential kernel vectors and start-up time in Chromium, Firefox and WebKit (T-5, T-37, T-44)
        env:
          HOME: /root
        working-directory: packages/kernel
        run: |
          npm ci
          npm run e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: packages/kernel/playwright-report
          retention-days: 7

  kernel-swift:
    name: kernel-swift
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: swift
          targets: host
      - name: Differential kernel vectors through Swift (T-5, T-37)
        run: just test-swift

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: tools
          tools: deny vet
      - name: cargo-deny (T-38)
        run: just deny
      - name: cargo-vet (T-38)
        run: just vet

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (T-38, T-60)
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  compose:
    name: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: compose
          tools: nextest
      - name: Room for the images and the test build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /
      - name: SoftHSM and the Access host name for the tests (T-56, T-96, T-101)
        run: |
          sudo apt-get update -q
          sudo apt-get install --yes --no-install-recommends softhsm2
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          printf 'directories.tokendir = %s\nobjectstore.backend = file\nlog.level = ERROR\n' \
            "$RUNNER_TEMP/softhsm/tokens" > "$RUNNER_TEMP/softhsm/softhsm2.conf"
          echo "SOFTHSM2_CONF=$RUNNER_TEMP/softhsm/softhsm2.conf" >> "$GITHUB_ENV"
          echo "127.0.0.1 access-server" | sudo tee -a /etc/hosts
          echo "127.0.0.1 relay" | sudo tee -a /etc/hosts
      - name: Local environment starts (T-41, T-51, T-56, T-57)
        run: just dev
      - name: Free the image build cache
        run: |
          docker builder prune --all --force
          df -h /
      - name: Ledger time against the local NTS and Roughtime servers and the Access client against the local Access (OP-32, OP-42, OP-43, T-41, T-96, T-101)
        env:
          NEXTEST_PROFILE: ci
        run: just test-compose
      - name: Product databases are isolated (T-51, T-8)
        run: |
          c() { docker compose -f deploy/compose/compose.yaml "$@"; }
          c exec -T -e PGPASSWORD=local-only-not-a-secret work-postgres psql -h 127.0.0.1 -U work_app -d work -tAc 'select 1'
          c exec -T -e PGPASSWORD=local-only-not-a-secret work-postgres psql -h 127.0.0.1 -U work_app -d work_derived -tAc 'select 1'
          for pair in work_app:access work_app:relay access_app:work relay_app:work access_app:work_derived relay_app:work_derived work_sequencer:work_derived work_reconciler:work; do
            role="${pair%%:*}" db="${pair#*:}"
            if c exec -T -e PGPASSWORD=local-only-not-a-secret work-postgres psql -h 127.0.0.1 -U "$role" -d "$db" -tAc 'select 1'; then
              echo "$role reached the $db database" >&2
              exit 1
            fi
          done
      - name: The S3-compatible body store answers (T-20, OP-2, OP-33)
        run: |
          for _ in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:7072/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7072/)" != "000"
      - name: Access and Relay answer, Relay over TLS at the suiss_relay Access names, with its own Access client in the bootstrap (T-51, E-2, MD-3, T-99)
        run: |
          c() { docker compose -f deploy/compose/compose.yaml "$@"; }
          c exec -T access cat /var/lib/access/certs/ca.crt > "$RUNNER_TEMP/access-ca.crt"
          doc=https://access-server:8443/.well-known/suiss-configuration/realms/platform
          for _ in $(seq 1 60); do curl -fsS --cacert "$RUNNER_TEMP/access-ca.crt" "$doc" >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS --cacert "$RUNNER_TEMP/access-ca.crt" "$doc" | jq -e '.issuer == "https://access-server:8443/realms/platform"'
          c exec -T access curl -fsS --cacert /var/lib/access/certs/ca.crt https://localhost:9090/readyz
          c exec -T access cat /var/lib/access/bootstrap/bootstrap.json | grep -q '"product": *"work"'
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:4010/readyz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:4010/readyz
          c exec -T access cat /var/lib/access/bootstrap/bootstrap.json | jq -er '.clients[] | select(.product == "relay") | .client_id'
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert "$RUNNER_TEMP/access-ca.crt" https://relay/.well-known/relay-configuration)" != "000"
      - name: Server is live and ready with the signer, reads Access's discovery over the access network and runs a Roughtime round (T-39, T-72, OP-43, T-96, E-2)
        run: |
          c() { docker compose -f deploy/compose/compose.yaml "$@"; }
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8191/readyz >/dev/null 2>&1 && break; sleep 1; done
