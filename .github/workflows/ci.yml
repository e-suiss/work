      - name: Stop
        if: always()
        run: just dev-down

  bench-instructions:
    name: bench-instructions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: bench
          tools: gungraun
      - name: Install Valgrind
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends valgrind
      - name: Baseline (base commit)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "HAVE_BASELINE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          head="$(git rev-parse HEAD)"
          git checkout --quiet "$BASE_SHA"
          if [[ -f crates/kernel/benches/kernel_instructions.rs ]]; then
            just bench-instructions --save-baseline=base
            echo "HAVE_BASELINE=true" >> "$GITHUB_ENV"
          else
            echo "HAVE_BASELINE=false" >> "$GITHUB_ENV"
          fi
          git checkout --quiet "$head"
      - name: Kernel regression gate, fails above 5 % unless a Bench-Accepted trailer accepts it (T-44, T-60, T-77)
        env:
          BENCH_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          cargo xtask check bench-accepted
          if [[ "$HAVE_BASELINE" != true ]]; then
            just bench-instructions
            exit 0
          fi
          if just bench-instructions --baseline=base --callgrind-limits='ir=5%'; then
            exit 0
          fi
          accepted="$(cargo xtask bench-accepted)"
          if [[ -z "$accepted" ]]; then
            exit 1
          fi
          just bench-instructions --baseline=base | tee bench-accepted.txt
          {
            echo "### Accepted instruction-count regression (T-77)"
            echo
            echo '```'
            echo "$accepted"
            echo '```'
            echo
            echo '```'
            cat bench-accepted.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
