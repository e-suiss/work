      - name: The test user's Party compromised reaches work-server, which writes the notice once into the ledger of the user's record, matched by its device Instance, and shows its window on the record's evidence; once Access retires Work's client, api_client.disabled fails every caller closed; the last step, since it ends the client (T-102, T-28, SEC-36)
        env:
