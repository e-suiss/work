# T-40, T-37, T-55, T-41, T-43
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fast:
    name: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # T-47
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: lint
      # T-60
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/xtask-cooldown-cache.json
          key: xtask-cooldown-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'packages/*/package-lock.json', '.github/**/*.yml') }}
          restore-keys: |
            xtask-cooldown-
      - name: Format (T-33)
        run: just fmt-check
      - name: Clippy, warnings are errors (T-33)
        run: just lint
      - name: Repository rules (T-31, T-36, T-46, T-52, T-60)
        env:
          XTASK_ONLINE: "1"
          XTASK_CATALOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: just rules
      - name: Record vectors regenerate byte for byte (P-11, P-72)
        run: just vectors
      - name: Install squawk 2.68.0 (T-52, T-60)
        env:
          SQUAWK_SHA256: 53070672cbe0b8adce55372931d4435cc2395edd8b5736819a82e483b08d4d09
        run: |
          curl -fsSL -o "$RUNNER_TEMP/squawk" \
            https://github.com/sbdchd/squawk/releases/download/v2.68.0/squawk-linux-x64
          echo "$SQUAWK_SHA256  $RUNNER_TEMP/squawk" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/squawk"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Migration safety (T-36)
        run: just squawk

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          tools: nextest
      - name: Tests (T-37)
        env:
          NEXTEST_PROFILE: ci
        run: just test
      - name: Tests against real PostgreSQL 18 and NATS JetStream (T-36, T-37)
        env:
          NEXTEST_PROFILE: ci
        run: just test-containers
      - name: Fetch every locked crate for the offline metadata
        run: cargo fetch --locked
      - name: Every rule cites a passing test (T-46, T-47)
        env:
          XTASK_NEXTEST: "1"
        run: cargo xtask check rule-coverage

  cddl:
    name: cddl
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/.github/cddl/Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: 4.0.7
          bundler-cache: true
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just@1.58.0
          fallback: none
      - name: Record vectors against the CDDL (P-11, P-72)
        run: |
          bundle exec cddl 2>&1 | grep -q 'version 0.12.14$'
          just cddl

  cross:
    name: cross
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: cross
      - name: Kernel no_std and WebAssembly builds (T-31, T-4)
        run: just cross

  kernel-bindings:
    name: kernel-bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: wasm
          tools: wasm-bindgen
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          # T-58
          cache-dependency-path: |
            packages/kernel/package-lock.json
      - name: Install (lockfile only, no install scripts; T-58, T-60)
        run: just web-install
      - name: npm vulnerability scan (T-38)
        run: just web-audit
      - name: Lint, type check, format, build (T-34, T-58)
        run: just web-check
      - name: Differential kernel vectors through WebAssembly (T-5, T-37)
        run: just web-test
      - name: Keep the WebAssembly build for the browser tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-wasm
          path: packages/kernel/wasm
          retention-days: 1
          if-no-files-found: error

  kernel-browser:
    name: kernel-browser
    needs: kernel-bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          # T-58
          cache-dependency-path: |
            packages/kernel/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kernel-wasm
          path: packages/kernel/wasm
      - name: Differential kernel vectors and start-up time in Chromium, Firefox and WebKit (T-5, T-37, T-44)
        env:
          HOME: /root
        working-directory: packages/kernel
        run: |
          npm ci
          npm run e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: packages/kernel/playwright-report
          retention-days: 7

  kernel-swift:
    name: kernel-swift
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: swift
          targets: host
      - name: Differential kernel vectors through Swift (T-5, T-37)
        run: just test-swift

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: tools
          tools: deny vet
      - name: cargo-deny (T-38)
        run: just deny
      - name: cargo-vet (T-38)
        run: just vet

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (T-38, T-60)
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  compose:
    name: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: compose
      - name: Local environment starts (T-41, T-51, T-56, T-57)
        run: just dev
      - name: Product databases are isolated (T-51, T-8)
        run: |
          c() { docker compose -f deploy/compose/compose.yaml "$@"; }
          c exec -T -e PGPASSWORD=local-only-not-a-secret postgres psql -h 127.0.0.1 -U work_app -d work -tAc 'select 1'
          c exec -T -e PGPASSWORD=local-only-not-a-secret postgres psql -h 127.0.0.1 -U work_app -d work_derived -tAc 'select 1'
          for pair in work_app:access work_app:relay access_app:work relay_app:work access_app:work_derived relay_app:work_derived work_sequencer:work_derived work_reconciler:work; do
            role="${pair%%:*}" db="${pair#*:}"
            if c exec -T -e PGPASSWORD=local-only-not-a-secret postgres psql -h 127.0.0.1 -U "$role" -d "$db" -tAc 'select 1'; then
              echo "$role reached the $db database" >&2
              exit 1
            fi
          done
      - name: Access and Relay answer (T-51, E-2, MD-3)
        run: |
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8180/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8180/healthz
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:4010/readyz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:4010/readyz
      - name: Server starts and stops
        env:
          WORK_LISTEN: 127.0.0.1:18090
          WORK_POSTGRES__CANONICAL: postgres://work_app@127.0.0.1:5442/work
          WORK_POSTGRES__DERIVED: postgres://work_app@127.0.0.1:5442/work_derived
          WORK_NATS__URL: nats://127.0.0.1:4232
          PGPASSWORD: local-only-not-a-secret
          NATS_USER: work
          NATS_PASSWORD: local-only-not-a-secret
        run: |
          cargo build --locked -p work-server
          target/debug/work-server &
          pid=$!
          for _ in $(seq 1 50); do (echo > /dev/tcp/127.0.0.1/18090) 2>/dev/null && break; sleep 0.2; done
          (echo > /dev/tcp/127.0.0.1/18090) 2>/dev/null
          kill -TERM "$pid"
          wait "$pid"
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs --no-color --tail 80 access relay relay-migrate
      - name: Stop
        if: always()
        run: just dev-down

  bench-instructions:
    name: bench-instructions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: bench
          tools: gungraun
      - name: Install Valgrind
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends valgrind
      - name: Baseline (base commit)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "HAVE_BASELINE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          head="$(git rev-parse HEAD)"
          git checkout --quiet "$BASE_SHA"
          if [[ -f crates/kernel/benches/kernel_instructions.rs ]]; then
            just bench-instructions --save-baseline=base
            echo "HAVE_BASELINE=true" >> "$GITHUB_ENV"
          else
            echo "HAVE_BASELINE=false" >> "$GITHUB_ENV"
          fi
          git checkout --quiet "$head"
      - name: Kernel regression gate, fails above 5 % unless a Bench-Accepted trailer accepts it (T-44, T-60, T-77)
        env:
          BENCH_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          cargo xtask check bench-accepted
          if [[ "$HAVE_BASELINE" != true ]]; then
            just bench-instructions
            exit 0
          fi
          if just bench-instructions --baseline=base --callgrind-limits='ir=5%'; then
            exit 0
          fi
          accepted="$(cargo xtask bench-accepted)"
          if [[ -z "$accepted" ]]; then
            exit 1
          fi
          just bench-instructions --baseline=base | tee bench-accepted.txt
          {
            echo "### Accepted instruction-count regression (T-77)"
            echo
            echo '```'
            echo "$accepted"
            echo '```'
            echo
            echo '```'
            cat bench-accepted.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
