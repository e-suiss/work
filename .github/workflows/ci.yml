          c logs work-server | grep 'access.pairing_ran' | tail -n 1 | grep -q '"paired":0'
          q -c "select tenant, slug, paired_at from work.access_realm where state = 'paired' order by tenant, slug" | diff "$RUNNER_TEMP/paired-before" -
