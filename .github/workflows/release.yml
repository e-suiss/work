# T-40, T-38, T-59, T-54
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  IMAGE: ghcr.io/e-suiss/work

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
          tools: auditable cyclonedx syft
      - name: Build (cargo auditable, --locked, remapped paths)
        env:
          TARGET: ${{ matrix.target }}
        run: just release-build "$TARGET"
      - name: Stage binaries and SBOMs (T-38)
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          for b in work-server work-signer work-cli; do cp "target/$TARGET/release/$b" "dist/$b-linux-$ARCH"; done
          bin="dist/work-server-linux-$ARCH"
          just sbom "$TARGET" "$bin" "$RUNNER_TEMP/sbom"
          for f in "$RUNNER_TEMP"/sbom/*.json; do
            base="$(basename "$f")"
            mv "$f" "dist/${base%%.*}-linux-$ARCH.${base#*.}"
          done
          (cd dist && sha256sum -- * > "SHA256SUMS-linux-$ARCH")
          cat "dist/SHA256SUMS-linux-$ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.arch }}
          path: dist
          if-no-files-found: error

  # T-59
  rebuild:
    name: rebuild (${{ matrix.arch }}, informational)
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
          tools: auditable
      - name: Second build
        env:
          TARGET: ${{ matrix.target }}
        run: just release-build "$TARGET"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ matrix.arch }}
          path: first
      - name: Compare digests
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          first="$(sha256sum "first/work-server-linux-$ARCH" | cut -d' ' -f1)"
          second="$(sha256sum "target/$TARGET/release/work-server" | cut -d' ' -f1)"
          {
            echo "### Second build, linux-$ARCH (informational, T-59)"
            echo
            echo "| build | sha256 |"
            echo "|---|---|"
            echo "| release | \`$first\` |"
            echo "| second | \`$second\` |"
            echo
            if [[ "$first" == "$second" ]]; then echo "Digests match."; else echo "Digests differ. This does not block the release."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # T-38
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
          tools: nextest
      - name: Tests
        run: just test
      - name: Test-result predicate
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p predicates
          python3 -I .github/scripts/test-result-predicate.py target/nextest/ci/junit.xml "$RUN_URL" \
            Cargo.lock rust-toolchain.toml .config/nextest.toml > predicates/test-result.json
          jq -e '.result == "PASSED"' predicates/test-result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-result
          path: predicates
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache: "false"
          tools: git-cliff cosign
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Build provenance (T-38)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/work-*-linux-amd64
            dist/work-*-linux-arm64
      - name: SBOM attestation, amd64 (T-38)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/work-server-linux-amd64
          sbom-path: dist/work-server-linux-amd64.cdx.json
      - name: SBOM attestation, arm64 (T-38)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/work-server-linux-arm64
          sbom-path: dist/work-server-linux-arm64.cdx.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-result
          path: ${{ runner.temp }}/predicates
      - name: Test-result attestation (T-38)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/work-*-linux-amd64
            dist/work-*-linux-arm64
          predicate-type: https://in-toto.io/attestation/test-result/v0.1
          predicate-path: ${{ runner.temp }}/predicates/test-result.json
      # T-38
      - name: VEX document
        env:
          TAG: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          products=()
          for arch in amd64 arm64; do
            sum="$(sha256sum "dist/work-server-linux-$arch" | cut -d' ' -f1)"
            products+=("pkg:generic/work-server@$version?arch=$arch&checksum=sha256:$sum")
          done
          python3 -I .github/scripts/openvex.py supply-chain/vex/statements.json \
            "$SERVER_URL/$REPOSITORY/releases/tag/$TAG#vex" "Suiss" "$(git log -1 --format=%cI)" \
            "${products[@]}" > dist/work-server.openvex.json
          cat dist/work-server.openvex.json
      - name: VEX attestation (T-38)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/work-*-linux-amd64
            dist/work-*-linux-arm64
          predicate-type: https://openvex.dev/ns/v0.2.0
          predicate-path: dist/work-server.openvex.json
      # T-38
      - name: Sigstore keyless signatures (T-38)
        run: |
          for file in dist/*; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      # T-40
      - name: Release notes
        run: git cliff --latest --strip all > "$RUNNER_TEMP/notes.md"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-publish:
    name: image-publish
    needs: [image, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
          tools: cosign syft
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create the multi-arch manifest
        id: manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          sources=()
          for d in "$RUNNER_TEMP"/digests/*; do sources+=("$IMAGE@sha256:$(basename "$d")"); done
          docker buildx imagetools create -t "$IMAGE:$version" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign the image (T-38)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Image provenance (T-38)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      # T-38
      - name: Image SBOM and VEX
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          TAG: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          syft scan "registry:$IMAGE@$DIGEST" -o "cyclonedx-json=$RUNNER_TEMP/image/sbom.cdx.json"
          python3 -I .github/scripts/openvex.py supply-chain/vex/statements.json \
            "$SERVER_URL/$REPOSITORY/releases/tag/$TAG#vex-image" "Suiss" "$(git log -1 --format=%cI)" \
            "pkg:oci/work@$DIGEST?repository_url=ghcr.io/e-suiss/work" > "$RUNNER_TEMP/image/openvex.json"
      - name: Image SBOM attestation (T-38)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: ${{ runner.temp }}/image/sbom.cdx.json
          push-to-registry: true
      - name: Image VEX attestation (T-38)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          predicate-type: https://openvex.dev/ns/v0.2.0
          predicate-path: ${{ runner.temp }}/image/openvex.json
          push-to-registry: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-result
          path: ${{ runner.temp }}/predicates
      - name: Image test-result attestation (T-38)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          predicate-type: https://in-toto.io/attestation/test-result/v0.1
          predicate-path: ${{ runner.temp }}/predicates/test-result.json
          push-to-registry: true

  # T-40, T-54
  publish-crates:
    name: publish-crates
    needs: [publish, image-publish]
    if: vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish the kernel
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p esuiss-work-kernel
