# T-40, T-37, T-38
name: Nightly

on:
  schedule:
    - cron: "53 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # T-36
  SQLX_OFFLINE: "true"

jobs:
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: tools
          tools: audit
      - name: cargo-audit (T-38)
        run: just audit

  supply-chain-watch:
    name: supply-chain-watch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: lint
      # T-60
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/xtask-cooldown-cache.json
          key: xtask-cooldown-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'packages/*/package-lock.json', '.github/**/*.yml') }}
          restore-keys: |
            xtask-cooldown-
      - name: Cooldown (T-60)
        env:
          XTASK_ONLINE: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask check cooldown
      - name: Maintainer watch list (T-38)
        env:
          XTASK_ONLINE: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask check maintainer-watchlist

  test-full:
    name: test-full
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          tools: nextest
      - name: SoftHSM for the signer (T-56, T-72)
        run: |
          sudo apt-get update -q
          sudo apt-get install --yes --no-install-recommends softhsm2
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          printf 'directories.tokendir = %s\nobjectstore.backend = file\nlog.level = ERROR\n' \
            "$RUNNER_TEMP/softhsm/tokens" > "$RUNNER_TEMP/softhsm/softhsm2.conf"
          echo "SOFTHSM2_CONF=$RUNNER_TEMP/softhsm/softhsm2.conf" >> "$GITHUB_ENV"
      - name: Full suite, including long-running tests (T-37)
        run: just test-full

  # T-101, T-41, T-102, T-103, T-104, T-97
  compose-signed:
    name: compose-signed
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: compose
          tools: nextest
      - name: Room for the images and the test build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /
      - name: SoftHSM and the Access host name for the tests (T-56, T-96, T-101)
        run: |
          sudo apt-get update -q
          sudo apt-get install --yes --no-install-recommends softhsm2
          echo "127.0.0.1 access-server" | sudo tee -a /etc/hosts
      - name: Local environment starts (T-41, T-51, T-56)
        run: just dev
      - name: Free the image build cache
        run: |
          docker builder prune --all --force
          df -h /
      - name: Once Access signs, waiting at most 150 minutes, the signed key lookup, real user tokens from Access's client and Work's own, and the reads work-server serves for that user (T-101, T-104, T-97)
        run: just test-compose-signed "$RUNNER_TEMP/access-local" 9000
      - name: Access pushes tenant.created to the event entry, which verifies it, records it once and pairs the new tenant (T-102, T-103)
        run: |
          c() { docker compose -f deploy/compose/compose.yaml "$@"; }
          q() { c exec -T -e PGPASSWORD=local-only-not-a-secret work-postgres psql -h 127.0.0.1 -U work_app -d work -tA "$@"; }
          c run --rm --no-deps -T --entrypoint access-server access-bootstrap bootstrap /etc/work-access/bootstrap-work-beta.toml > "$RUNNER_TEMP/bootstrap-beta.json"
          beta="$(jq -er '.realms[] | select(.slug == "beta") | .tenant' "$RUNNER_TEMP/bootstrap-beta.json")"
          for _ in $(seq 1 180); do c logs work-server | grep 'access.event_accepted' | grep 'tenant.created' | grep -q "$beta" && break; sleep 1; done
          c logs work-server | grep 'access.event_accepted' | grep 'tenant.created' | grep "$beta"
          if c logs work-server | grep -q 'access.event_refused'; then c logs work-server | grep 'access.event_refused'; exit 1; fi
          scope="$(printf 'work/inbound/access-tenant/v1\000%s' "$beta" | sha256sum | cut -d' ' -f1)"
          test "$(q -c "select set_config('app.ledger_id', '$scope', false)" -c "select count(*) from work.inbound_seen where source = 'https://access-server:8443/realms/platform'" | tail -n 1)" = 1
          for _ in $(seq 1 120); do test "$(q -c "select count(*) from work.access_realm where tenant = '$beta' and state = 'paired'")" -ge 1 && break; sleep 1; done
          test "$(q -c "select count(*) from work.access_realm where tenant = '$beta' and state = 'paired'")" -ge 1
      - name: A compromise declaration reaches the entry as party.compromised with its window, which drops the domain's keys and raises a signal (T-102)
        run: |
          c() { docker compose -f deploy/compose/compose.yaml "$@"; }
          b="$RUNNER_TEMP/access-local/bootstrap.json"
          acme="$(jq -er '.realms[] | select(.slug == "acme") | .tenant' "$b")"
          c run --rm --no-deps -T --entrypoint access-local-client access-bootstrap compromise \
            --api https://access-server:8443 --ca /var/lib/access/certs/ca.crt \
            --cert /var/lib/access/certs/pep.crt --key /var/lib/access/certs/pep.key \
            --domain "$(jq -er '.compromise.domain' "$b")" --issuer-party "$(jq -er '.compromise.issuer' "$b")" \
            --party "$(jq -er '.sample.subject' "$b")"
          for _ in $(seq 1 180); do c logs work-server | grep 'access.party_compromised' | grep -q "$acme" && break; sleep 1; done
          c logs work-server | grep 'access.event_accepted' | grep 'party.compromised' | grep "$acme"
          c logs work-server | grep 'access.party_compromised' | grep "$acme" | grep -q 'compromised from'
          if c logs work-server | grep -q 'access.compromise_unprocessed'; then exit 1; fi
          if c logs work-server | grep -q 'access.event_refused'; then c logs work-server | grep 'access.event_refused'; exit 1; fi
      - name: A paused platform stream lowers work_access_event_stream_up and raises attention; enabled again, it is up (T-102, T-103)
        run: |
          c() { docker compose -f deploy/compose/compose.yaml "$@"; }
          step() {
            runs="$(c logs work-server | grep -c 'access.pairing_ran')"
            c restart work-server
            for _ in $(seq 1 180); do test "$(c logs work-server | grep -c 'access.pairing_ran')" -gt "$runs" && break; sleep 1; done
            for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8191/readyz >/dev/null 2>&1 && break; sleep 1; done
          }
          just test-compose-only "$RUNNER_TEMP/access-local" status::t_102_the_owner_pauses_the_platform_stream
          step
          c logs work-server | grep 'access.event_stream_down' | grep -q 'paused'
          curl -fsS http://127.0.0.1:8191/metrics | grep -qx 'work_access_event_stream_up 0'
          just test-compose-only "$RUNNER_TEMP/access-local" status::t_102_the_owner_enables_the_platform_stream_again
          step
          curl -fsS http://127.0.0.1:8191/metrics | grep -qx 'work_access_event_stream_up 1'
      - name: A disabled stream is opened again by work-server and counted (T-103)
        run: |
          c() { docker compose -f deploy/compose/compose.yaml "$@"; }
          q() { c exec -T -e PGPASSWORD=local-only-not-a-secret work-postgres psql -h 127.0.0.1 -U work_app -d work -tA "$@"; }
          before="$(q -c "select stream_id from work.access_event_stream")"
          just test-compose-upkeep
          runs="$(c logs work-server | grep -c 'access.pairing_ran')"
          c restart work-server
          for _ in $(seq 1 180); do test "$(c logs work-server | grep -c 'access.pairing_ran')" -gt "$runs" && break; sleep 1; done
          c logs work-server | grep -q 'access.event_stream_recreated'
          test "$(q -c "select recreated from work.access_event_stream")" = 1
          test "$(q -c "select stream_id from work.access_event_stream")" != "$before"
          curl -fsS http://127.0.0.1:8191/metrics | grep -qx 'work_access_event_stream_recreated_total 1'
          curl -fsS http://127.0.0.1:8191/metrics | grep -qx 'work_access_event_stream_up 1'
      - name: Access pushes api_client.updated for Work's client, which raises a signal (T-102)
        run: |
          c() { docker compose -f deploy/compose/compose.yaml "$@"; }
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8191/readyz >/dev/null 2>&1 && break; sleep 1; done
          c run --rm --no-deps -T --entrypoint access-server access-bootstrap client-update /etc/work-access/bootstrap-work.toml work "Suiss Work (renamed)"
          for _ in $(seq 1 180); do c logs work-server | grep -q 'access.client_updated' && break; sleep 1; done
          c logs work-server | grep 'access.event_accepted' | grep -q 'api_client.updated'
          c logs work-server | grep -q 'access.client_updated'
      - name: Once Access retires Work's client, api_client.disabled fails every caller closed; the last step, since it ends the client (T-102, T-28)
        run: |
          c() { docker compose -f deploy/compose/compose.yaml "$@"; }
          just test-compose-only "$RUNNER_TEMP/access-local" retired::t_102_before_work_s_client_is_retired_the_test_user_is_named
          c run --rm --no-deps -T --entrypoint access-server access-bootstrap client-retire /etc/work-access/bootstrap-work.toml work
          for _ in $(seq 1 180); do c logs work-server | grep -q 'access.client_disabled' && break; sleep 1; done
          c logs work-server | grep 'access.event_accepted' | grep -q 'api_client.disabled'
          c logs work-server | grep -q 'access.client_disabled'
          just test-compose-only "$RUNNER_TEMP/access-local" retired::t_102_once_work_s_client_is_disabled_no_caller_is_named
          if c logs work-server | grep -q 'access.event_refused'; then c logs work-server | grep 'access.event_refused'; exit 1; fi
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs --no-color --tail 200 work-access-keys work-access-pep access-init access-bootstrap access-signer access-identity-signer access work-server
      - name: Stop
        if: always()
        run: just dev-down

  mutants:
    name: mutants (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          tools: nextest mutants
      - name: cargo-mutants on the kernel, report-only (T-37)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          status=0
          just mutants --shard "$SHARD/4" --jobs 2 || status=$?
          case "$status" in
            0) ;;
            2|3) echo "::warning::cargo-mutants shard $SHARD/4 exited $status (missed or timed-out mutants); see mutants-report-$SHARD" ;;
            *) exit "$status" ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-report-${{ matrix.shard }}
          path: mutants.out
          retention-days: 30
          if-no-files-found: ignore

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [smoke]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: fuzz
          tools: fuzz
          toolchain: nightly-2026-10-01
      - name: cargo-fuzz for five minutes (T-37)
        env:
          TARGET: ${{ matrix.target }}
        run: just fuzz "$TARGET" -max_total_time=300
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          retention-days: 30
          if-no-files-found: ignore
