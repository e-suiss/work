# T-40, T-37, T-38
name: Nightly

on:
  schedule:
    - cron: "53 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: tools
          tools: audit
      - name: cargo-audit (T-38)
        run: just audit

  supply-chain-watch:
    name: supply-chain-watch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: lint
      - name: Cooldown (T-60)
        env:
          XTASK_ONLINE: "1"
        run: cargo xtask check cooldown
      - name: Maintainer watch list (T-38)
        env:
          XTASK_ONLINE: "1"
        run: cargo xtask check maintainer-watchlist

  test-full:
    name: test-full
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          tools: nextest
      - name: Full suite, including long-running tests (T-37)
        run: just test-full

  mutants:
    name: mutants (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: test
          tools: nextest mutants
      - name: cargo-mutants on the kernel, report-only (T-37)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          status=0
          just mutants --shard "$SHARD/4" --jobs 2 || status=$?
          case "$status" in
            0) ;;
            2|3) echo "::warning::cargo-mutants shard $SHARD/4 exited $status (missed or timed-out mutants); see mutants-report-$SHARD" ;;
            *) exit "$status" ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-report-${{ matrix.shard }}
          path: mutants.out
          retention-days: 30
          if-no-files-found: ignore

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [smoke]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: fuzz
          tools: fuzz
          toolchain: nightly-2026-10-01
      - name: cargo-fuzz for five minutes (T-37)
        env:
          TARGET: ${{ matrix.target }}
        run: just fuzz "$TARGET" -max_total_time=300
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          retention-days: 30
          if-no-files-found: ignore
