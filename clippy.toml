# T-33
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
doc-valid-idents = ["JetStream", "CloudEvents", ".."]

# T-32, T-52
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "T-32: time comes from the Clock port (ledger time)" },
    { path = "std::time::Instant::now", reason = "T-32: time comes from the Clock port" },
    { path = "chrono::Utc::now", reason = "T-32: time comes from the Clock port" },
    { path = "chrono::Local::now", reason = "T-32: time comes from the Clock port" },
    { path = "time::OffsetDateTime::now_utc", reason = "T-32: time comes from the Clock port" },
    { path = "time::OffsetDateTime::now_local", reason = "T-32: time comes from the Clock port" },
    { path = "rand::thread_rng", reason = "T-32: randomness comes from the Rng port" },
    { path = "rand::rng", reason = "T-32: randomness comes from the Rng port" },
    { path = "rand::random", reason = "T-32: randomness comes from the Rng port" },
    { path = "uuid::Uuid::new_v4", reason = "T-32: identifiers come from the Rng port" },
    { path = "uuid::Uuid::now_v7", reason = "T-32: identifiers come from the Clock and Rng ports" },
    { path = "getrandom::getrandom", reason = "T-32: randomness comes from the Rng port" },
    { path = "getrandom::fill", reason = "T-32: randomness comes from the Rng port" },
    { path = "tokio::sync::mpsc::unbounded_channel", reason = "T-32 rule 7: channels are bounded; use tokio::sync::mpsc::channel" },
    { path = "futures_channel::mpsc::unbounded", reason = "T-32 rule 7: channels are bounded; use futures_channel::mpsc::channel" },
    { path = "std::sync::mpsc::channel", reason = "T-32 rule 7: channels are bounded; use std::sync::mpsc::sync_channel" },
    { path = "flume::unbounded", reason = "T-32 rule 7: channels are bounded; use flume::bounded" },
    { path = "crossbeam_channel::unbounded", reason = "T-32 rule 7: channels are bounded; use crossbeam_channel::bounded" },
    { path = "async_channel::unbounded", reason = "T-32 rule 7: channels are bounded; use async_channel::bounded" },
    { path = "kanal::unbounded", reason = "T-32 rule 7: channels are bounded; use kanal::bounded" },
    { path = "kanal::unbounded_async", reason = "T-32 rule 7: channels are bounded; use kanal::bounded_async" },
    { path = "tokio_stream::wrappers::UnboundedReceiverStream::new", reason = "T-32 rule 7: queues are bounded; use ReceiverStream" },
]
disallowed-types = [
    { path = "rand::rngs::ThreadRng", reason = "T-32: randomness comes from the Rng port" },
    { path = "rand::rngs::OsRng", reason = "T-32: randomness comes from the Rng port" },
    { path = "tokio::sync::mpsc::UnboundedSender", reason = "T-32 rule 7: channels are bounded; use tokio::sync::mpsc::Sender" },
    { path = "tokio::sync::mpsc::UnboundedReceiver", reason = "T-32 rule 7: channels are bounded; use tokio::sync::mpsc::Receiver" },
    { path = "tokio::sync::mpsc::WeakUnboundedSender", reason = "T-32 rule 7: channels are bounded; use tokio::sync::mpsc::WeakSender" },
    { path = "futures_channel::mpsc::UnboundedSender", reason = "T-32 rule 7: channels are bounded; use futures_channel::mpsc::Sender" },
    { path = "futures_channel::mpsc::UnboundedReceiver", reason = "T-32 rule 7: channels are bounded; use futures_channel::mpsc::Receiver" },
    { path = "std::sync::mpsc::Sender", reason = "T-32 rule 7: channels are bounded; use std::sync::mpsc::SyncSender" },
    { path = "tokio_stream::wrappers::UnboundedReceiverStream", reason = "T-32 rule 7: queues are bounded; use ReceiverStream" },
]
