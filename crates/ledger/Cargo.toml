[package]
name = "work-ledger"
description = "Work binding of the shared ledger platform: ledger log, sequencer, placement directory (T-7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
suiss-ledger = { workspace = true }
suiss-crypto = { workspace = true, features = ["verify"] }
work-store = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
work-testkit = { workspace = true }

[lints]
workspace = true
