[package]
name = "work-ledger"
description = "Work binding of the shared ledger platform: ledger log, sequencer, placement directory (T-7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
suiss-ledger = { workspace = true }
suiss-crypto = { workspace = true, features = ["verify", "pkcs11"] }
work-kernel = { workspace = true }
work-proto = { workspace = true }
work-store = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["std"] }
ntp-proto = { workspace = true }
roughenough-protocol = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http = { workspace = true, features = ["std"] }
http-body-util = { workspace = true }
bytes = { workspace = true, features = ["std"] }
hmac = { workspace = true, optional = true }
tokio-rustls = { workspace = true }

# T-20, T-32
[features]
s3 = ["dep:hmac"]

[dev-dependencies]
ed25519-dalek = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
work-testkit = { workspace = true }

[lints]
workspace = true
