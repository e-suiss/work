[package]
name = "work-query"
description = "Query service: the caller from an Access token, scoped reads, incremental sync and evidence, and the commitment Declarations written under Access authority (T-13, T-14, T-26, P-13)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
suiss-crypto = { workspace = true, features = ["pkcs11"] }
suiss-restriction = { workspace = true }
work-access-client = { workspace = true }
work-kernel = { workspace = true }
work-ledger = { workspace = true }
work-proto = { workspace = true }
work-store = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
suiss-crypto = { workspace = true, features = ["pkcs11", "verify"] }
base64 = { workspace = true, features = ["alloc"] }
bytes = { workspace = true, features = ["std"] }
http = { workspace = true, features = ["std"] }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-rustls = { workspace = true }

[lints]
workspace = true
