[package]
name = "work-store"
description = "PostgreSQL access, row-level security and ledger scope in the type system (T-36)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# T-36
[dependencies]
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "migrate"] }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
work-testkit = { workspace = true }

[lints]
workspace = true
