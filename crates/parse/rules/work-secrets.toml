# SEC-35, SEC-24

[[rules]]
id = "work-pem-private-key"
description = "A PEM private key header followed by key material."
regex = '''(?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----[\s\S]{0,256}?[A-Za-z0-9+/]{32}'''
keywords = ["-----begin"]

[[rules]]
id = "work-pan"
description = "A payment card primary account number with a brand prefix and length that passes the Luhn check."
regex = '''\b(?:[0-9][ -]?){11,18}[0-9]\b'''
validate = "pan"
