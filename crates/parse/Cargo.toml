[package]
name = "work-parse"
description = "Every parser (CBOR, JSON, CloudEvents, A2A, MCP); limits apply before decoding (P-7, P-33)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# SEC-35
[dependencies]
work-kernel = { workspace = true }
regex = { workspace = true, features = ["std", "perf", "unicode"] }
aho-corasick = { workspace = true, features = ["std", "perf-literal"] }
serde = { workspace = true, features = ["std", "derive"] }
toml = { workspace = true, features = ["std", "parse", "serde"] }
sha2 = { workspace = true }
thiserror = { workspace = true, features = ["std"] }

[lints]
workspace = true
