[package]
name = "work-dispatch"
description = "Event dispatcher: outbox to NATS to Relay, webhooks, Executor bindings (T-17)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# T-17 T-76 P-37 T-99
[dependencies]
suiss-crypto = { workspace = true, features = ["signer"] }
work-access-client = { workspace = true }
work-proto = { workspace = true }
work-relay-client = { workspace = true }
work-store = { workspace = true }
async-nats = { workspace = true, features = ["jetstream"] }
futures-util = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
work-testkit = { workspace = true }

[lints]
workspace = true
