# T-38

title = "Work gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Generated and third-party files"
paths = [
    '''(^|/)target/''',
    '''(^|/)node_modules/''',
    '''(^|/)Cargo\.lock$''',
    '''(^|/)package-lock\.json$''',
    '''^supply-chain/imports\.lock$''',
]

[[allowlists]]
description = "Secret-detection patterns, not secrets"
paths = [
    '''^deploy/compose/observability/otel-collector\.yaml$''',
    '''^crates/parse/vendor/gitleaks-[0-9.]+/gitleaks\.toml$''',
    '''^crates/parse/rules/work-secrets\.toml$''',
]

[[allowlists]]
description = "Test-only keys of the local NTS and Roughtime servers"
paths = [
    '''^deploy/compose/nts/pki/server-test-only\.key$''',
    '''^deploy/compose/roughtime/seeds/[a-c]-test-only\.seed$''',
]

[[allowlists]]
description = "Access conformance vectors: public test keys and signatures (T-101)"
paths = [
    '''^conformance/vectors/access/key-scope\.json$''',
]
