  schemas:
    CloudEvent:
      description: "The CloudEvents 1.0 structured envelope of every Work event (P-35); the event is thin and carries no record body (P-37)."
      properties:
        correlationid:
          type: "string"
        data:
          type: "object"
        datacontenttype:
          const: "application/json"
          type: "string"
        dataschema:
          description: "The versioned data schema path."
          type: "string"
        id:
          description: "Event id, the same in every delivery attempt."
          type: "string"
        ledger:
          description: "LedgerID of the source record, lower-case hex."
          pattern: "^[0-9a-f]{64}$"
          type: "string"
        pos:
          description: "Ledger position of the source record, decimal."
          pattern: "^(0|[1-9][0-9]*)$"
          type: "string"
        recordid:
          description: "Digest of the source record, lower-case hex."
          pattern: "^[0-9a-f]{64}$"
          type: "string"
        seq:
          description: "Monotonic version per subject, decimal (T-81)."
          pattern: "^[1-9][0-9]*$"
          type: "string"
        source:
          description: "The installation URI and the ledger: <installation>/ledgers/<ledger hex> (P-98)."
          format: "uri"
          type: "string"
        specversion:
          const: "1.0"
          type: "string"
        subject:
          description: "The prefixed id of the item (P-112)."
          type: "string"
        time:
          description: "recorded_at of the source record."
          format: "date-time"
          type: "string"
        traceparent:
          pattern: "^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"
          type: "string"
        type:
          description: "<item>.<past tense> (P-38)."
          type: "string"
      required:
        - "specversion"
        - "id"
        - "source"
        - "type"
        - "time"
        - "subject"
        - "datacontenttype"
        - "dataschema"
        - "seq"
        - "recordid"
        - "ledger"
        - "pos"
        - "data"
      type: "object"
defaultContentType: "application/cloudevents+json"
info:
  description: "Every Work event type: one event per record and affected item, named <item>.<past tense>; the item a record is about takes the type of its wire name and every other item it touches takes <item>.changed (T-98 items 4 and 5). Events are CloudEvents 1.0, thin, and come from the transactional outbox after the record is durable."
  license:
    name: "Apache-2.0"
  title: "Work events"
  version: "1"
operations:
  sendEvents:
    action: "send"
    channel:
      "$ref": "#/channels/events"
    messages:
