[package]
name = "work-executor"
description = "The conformant test executor: a minimal real executor of Work's coordination contract, run only in the local environment and never deployed in production (T-105, RC-42)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# T-105 RC-42 T-101 T-56
[dependencies]
suiss-crypto = { workspace = true, features = ["aws-lc", "pkcs11"] }
work-access-client = { workspace = true }
work-kernel = { workspace = true }
work-proto = { workspace = true }
work-telemetry = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio"] }
base64 = { workspace = true, features = ["alloc"] }
bytes = { workspace = true, features = ["std"] }
http = { workspace = true, features = ["std"] }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { workspace = true }
toml = { workspace = true, features = ["parse", "serde", "std"] }
tracing = { workspace = true, features = ["std"] }

[lints]
workspace = true
