[package]
name = "work-server"
description = "Work server: composes the Work components into one process (T-1, T-31). No business logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
suiss-crypto = { workspace = true, features = ["aws-lc"] }
suiss-sandbox = { workspace = true }
work-access-client = { workspace = true }
work-dispatch = { workspace = true }
work-http = { workspace = true }
work-kernel = { workspace = true }
work-ledger = { workspace = true, features = ["s3"] }
work-parse = { workspace = true }
work-proto = { workspace = true }
work-reconciler = { workspace = true }
work-store = { workspace = true }
work-telemetry = { workspace = true }
async-nats = { workspace = true, features = ["jetstream"] }
base64 = { workspace = true, features = ["alloc"] }
axum = { workspace = true, features = ["http1", "http2", "tokio"] }
figment = { workspace = true, features = ["env", "toml"] }
serde = { workspace = true, features = ["derive", "std"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
futures-util = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
suiss-crypto = { workspace = true, features = ["pkcs11"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
work-testkit = { workspace = true }

[lints]
workspace = true
