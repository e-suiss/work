[package]
name = "work-signer"
description = "Work signer process: ledger acknowledgements as checkpoint note signatures through PKCS#11, locked down (T-7, T-56, T-72)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
suiss-crypto = { workspace = true, features = ["pkcs11"] }
suiss-sandbox = { workspace = true }
work-proto = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
thiserror = { workspace = true, features = ["std"] }
toml = { workspace = true, features = ["parse", "serde", "std"] }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
work-kernel = { workspace = true }
work-ledger = { workspace = true }
work-store = { workspace = true }
work-testkit = { workspace = true }

[lints]
workspace = true
