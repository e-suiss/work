[package]
name = "work-cli"
description = "Work command line: administration, export, replay and offline verification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# T-36 OP-28 OP-1 OP-35 OP-47 T-39 P-2 T-103
[dependencies]
suiss-crypto = { workspace = true, features = ["aws-lc"] }
tokio = { workspace = true, features = ["rt", "time"] }
work-access-client = { workspace = true }
work-export = { workspace = true }
work-ledger = { workspace = true, features = ["s3"] }
work-proto = { workspace = true }
work-reconciler = { workspace = true }
work-store = { workspace = true }
work-telemetry = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
work-kernel = { workspace = true }
work-testkit = { workspace = true }

[lints]
workspace = true
