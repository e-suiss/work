[workspace]
resolver = "3"
members = ["crates/*", "bins/*", "sdks/bindings/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/e-suiss/work"
publish = false

# T-31, T-54
[workspace.dependencies]
work-kernel = { package = "esuiss-work-kernel", path = "crates/kernel", default-features = false }
work-proto = { path = "crates/proto" }
work-parse = { path = "crates/parse" }
work-store = { path = "crates/store" }
work-dispatch = { path = "crates/dispatch" }
work-ledger = { path = "crates/ledger" }
work-rpc = { path = "crates/rpc" }
work-access-client = { path = "crates/access-client" }
work-reconciler = { path = "crates/reconciler" }
work-relay-client = { path = "crates/relay-client" }
work-telemetry = { path = "crates/telemetry" }
work-http = { path = "crates/http" }
work-query = { path = "crates/query" }
work-export = { path = "crates/export" }
work-testkit = { path = "crates/testkit" }
work-bindings-core = { path = "sdks/bindings/core" }

# T-31, T-54, T-72, T-74
suiss-ledger = { package = "esuiss-ledger", version = "=0.2.6", default-features = false }
suiss-crypto = { package = "esuiss-crypto", version = "=0.2.6", default-features = false }
suiss-restriction = { package = "esuiss-restriction", version = "=0.2.6", default-features = false }
suiss-sandbox = { package = "esuiss-sandbox", version = "=0.2.6", default-features = false }
# OP-14 OP-30 Access OP-147
suiss-retention = { package = "esuiss-retention", version = "=0.2.6", default-features = false }
# T-101 T-103
access-kernel = { package = "esuiss-access-kernel", version = "=0.2.6", default-features = false }

# T-60
thiserror = { version = "2.0.21", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false }
toml = { version = "1.1.6", default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
tokio = { version = "1.53.3", default-features = false }
axum = { version = "0.8.9", default-features = false }
# T-37
tower-service = { version = "=0.3.3", default-features = false }
# T-98
utoipa = { version = "=6.0.0", default-features = false }
# T-36
sqlx = { version = "=0.9.0", default-features = false }
# T-36, T-37
testcontainers = { version = "=0.28.0", default-features = false }
async-nats = { version = "=0.50.0", default-features = false }
futures-util = { version = "=0.3.34", default-features = false }
figment = { version = "0.10.19", default-features = false }
# T-39, OP-19
opentelemetry = { version = "=0.33.1", default-features = false }
opentelemetry_sdk = { version = "=0.33.1", default-features = false }
opentelemetry-otlp = { version = "=0.33.1", default-features = false }
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
# SEC-35
regex = { version = "=1.13.1", default-features = false }
aho-corasick = { version = "=1.1.5", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
# T-20, OP-2
hyper = { version = "=1.11.1", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false }
http = { version = "=1.5.0", default-features = false }
http-body-util = { version = "=0.1.5", default-features = false }
bytes = { version = "=1.12.1", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
tokio-rustls = { version = "=0.26.6", default-features = false }
# T-44
divan = { version = "0.1.21", default-features = false }
gungraun = { version = "=0.20.0", default-features = false }
# OP-32, OP-42, OP-44
ntp-proto = { version = "=1.9.0", default-features = false, features = ["aws-lc", "rustcrypto", "__internal-api"] }
roughenough-protocol = { version = "=2.2.0", default-features = false }
rustls = { version = "=0.23.46", default-features = false }
base64 = { version = "=0.22.1", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false }
# T-56, OP-45
cryptoki = { version = "=0.12.1", default-features = false }
# T-5, T-58
wasm-bindgen = { version = "=0.2.129", default-features = false }
uniffi = { version = "=0.32.2", default-features = false }

[workspace.lints.rust]
# T-33
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"
rust_2024_compatibility = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# T-33
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
# T-32
disallowed_methods = "deny"
disallowed_types = "deny"

# T-33
[profile.release]
overflow-checks = true
panic = "unwind"
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
