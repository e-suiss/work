[workspace]
resolver = "3"
members = ["crates/*", "bins/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/e-suiss/work"
publish = false

# T-31, T-54
[workspace.dependencies]
work-kernel = { package = "esuiss-work-kernel", path = "crates/kernel", default-features = false }
work-proto = { path = "crates/proto" }
work-parse = { path = "crates/parse" }
work-store = { path = "crates/store" }
work-ledger = { path = "crates/ledger" }
work-rpc = { path = "crates/rpc" }
work-access-client = { path = "crates/access-client" }
work-relay-client = { path = "crates/relay-client" }
work-telemetry = { path = "crates/telemetry" }
work-http = { path = "crates/http" }
work-testkit = { path = "crates/testkit" }

# T-60
thiserror = { version = "2.0.21", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.151", default-features = false }
toml = { version = "1.1.6", default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
tokio = { version = "1.53.1", default-features = false }
axum = { version = "0.8.9", default-features = false }
figment = { version = "0.10.19", default-features = false }
# T-44
divan = { version = "0.1.21", default-features = false }
gungraun = { version = "=0.20.0", default-features = false }

[workspace.lints.rust]
# T-33
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"
rust_2024_compatibility = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# T-33
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
# T-32
disallowed_methods = "deny"
disallowed_types = "deny"

# T-33
[profile.release]
overflow-checks = true
panic = "unwind"
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
