# T-51, T-99, E-91
global
    log stderr format raw local0 warning
    ssl-default-bind-options ssl-min-ver TLSv1.3

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend tls
    bind :443 ssl crt /tmp/relay-proxy.pem
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    option forwardfor
    default_backend relay

backend relay
    server relay "127.0.0.1:${PORT}"
