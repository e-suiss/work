# OP-32, OP-42, OP-43, T-41, T-20, T-39, OP-33, T-76, OP-46, SEC-32

[postgres]
canonical = "postgres://work_app@postgres:5432/work"
derived = "postgres://work_app@postgres:5432/work_derived"
sequencer = "postgres://work_sequencer@postgres:5432/work"
checkpointer = "postgres://work_checkpointer@postgres:5432/work"
publisher = "postgres://work_publisher@postgres:5432/work"
deriver = "postgres://work_deriver@postgres:5432/work_derived"

[nats]
url = "nats://nats:4222"

[signer]
socket = "/run/work-signer/signer.sock"

[checkpoint]
origin_prefix = "work.localhost/ledger/"

[replica]
directory = "/var/lib/work/replica"

[publisher]
source = "https://work.localhost"

[declaration]
deployment = "self-host"
time_sources = "dependent"
witness = "local-dependent"

[[witnesses]]
id = "local_witness"
url = "http://witness:7380"
key_file = "/run/witness/witness.vkey"
role = "counted"

[ledger_time]
nts_roots = "/etc/work/nts-root.pem"
nts = [
  { host = "nts-a", port = 14460 },
  { host = "nts-b", port = 14461 },
]
roughtime = [
  { address = "roughtime-a:5319", public_key = "ZPbtnLTku4KBCF8B1YIhFSsDdpYs6CW/35mPsv5ZgvM=", version = "rfc" },
  { address = "roughtime-b:5319", public_key = "RW6UPuZR++RA8vjZRifiCkVfPCvAggemi7RlkQRLdrk=", version = "rfc" },
  { address = "roughtime-c:5319", public_key = "yFLhuJSAjDrmKPwqy0zrWYZcHfiuvQfW+iCgHsufKWU=", version = "rfc" },
]
