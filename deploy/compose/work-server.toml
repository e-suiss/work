# OP-32, OP-42, OP-43, T-41, T-20, T-39, OP-33, T-76, OP-46, SEC-32, T-96, E-2, T-101, T-102, T-103, T-97

[suiss]
access = "https://access-server:8443/realms/platform"
region = "eu"
tls_roots = "/var/lib/access/product-tls/ca.crt"

[access]
token = "work-dev"
client_id_file = "/run/work-access/client_id"

[inbound]
listen = "0.0.0.0:8443"
certificate = "/var/lib/access/product-tls/work-server.crt"

[api]
origin = "http://127.0.0.1:8190"

[postgres]
canonical = "postgres://work_app@work-postgres:5432/work"
derived = "postgres://work_app@work-postgres:5432/work_derived"
sequencer = "postgres://work_sequencer@work-postgres:5432/work"
checkpointer = "postgres://work_checkpointer@work-postgres:5432/work"
publisher = "postgres://work_publisher@work-postgres:5432/work"
deriver = "postgres://work_deriver@work-postgres:5432/work_derived"
access = "postgres://work_access@work-postgres:5432/work"

[nats]
url = "nats://nats:4222"

[signer]
socket = "/run/work-signer/signer.sock"

[checkpoint]
origin_prefix = "work.localhost/ledger/"

[replica]
id = "local"

[replica.s3]
endpoint = "http://s3:7070"
region = "us-east-1"
bucket = "work-replica"
retention_days = 3650

[publisher]
source = "https://work-server:8443"

[declaration]
deployment = "self-host"
time_sources = "dependent"
witness = "local-dependent"

[[witnesses]]
id = "local_witness"
url = "http://witness:7380"
key_file = "/run/witness/witness.vkey"
role = "counted"

[ledger_time]
nts_roots = "/etc/work/nts-root.pem"
nts = [
  { host = "nts-a", port = 14460 },
  { host = "nts-b", port = 14461 },
]
roughtime = [
  { address = "roughtime-a:5319", public_key = "ZPbtnLTku4KBCF8B1YIhFSsDdpYs6CW/35mPsv5ZgvM=", version = "rfc" },
  { address = "roughtime-b:5319", public_key = "RW6UPuZR++RA8vjZRifiCkVfPCvAggemi7RlkQRLdrk=", version = "rfc" },
  { address = "roughtime-c:5319", public_key = "yFLhuJSAjDrmKPwqy0zrWYZcHfiuvQfW+iCgHsufKWU=", version = "rfc" },
]
