# T-41, T-51, T-8
server_name: work-dev
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 1GB
}

accounts {
  WORK: {
    jetstream: enabled
    users: [{ user: work, password: local-only-not-a-secret }]
  }
  ACCESS: {
    jetstream: enabled
    users: [{ user: access, password: local-only-not-a-secret }]
  }
  RELAY: {
    jetstream: enabled
    users: [{ user: relay, password: local-only-not-a-secret }]
  }
  SYS: {
    users: [{ user: sys, password: local-only-not-a-secret }]
  }
}
system_account: SYS
