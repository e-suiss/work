# T-41, T-51, T-56, T-57, T-32, OP-32, OP-43, OP-33, OP-46

name: work-dev

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-access-hardening: &access-hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-access-process: &access-process
  <<: *access-hardening
  platform: linux/amd64
  user: "65532:65532"
  read_only: true
  tmpfs:
    - /tmp:uid=65532,gid=65532

# T-51, T-56
x-relay-process: &relay-process
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  platform: linux/amd64
  user: "65532:65532"
  read_only: true
  tmpfs:
    - /tmp:uid=65532,gid=65532
    - /app/tmp:uid=65532,gid=65532
  secrets:
    - source: relay_db_password
      target: /run/secrets/relay-db-password
    - source: relay_s3_secret
      target: /run/secrets/relay-s3-secret
    - source: relay_secret_key_base
      target: /run/secrets/relay-secret-key-base
    - source: relay_hsm_pin
      target: /run/secrets/relay-hsm-pin

# T-51, T-56, T-99, MD-3
x-relay-env: &relay-env
  RELAY_HOST: relay
  RELAY_ROLES: api,worker,socket
  RELAY_ACCESS_ISSUER: https://access-server:8443/realms/platform
  LOCAL_ACCESS_CLIENT_FILE: /var/lib/relay-client/client_id
  PORT: "4000"
  METRICS_PORT: "9568"
  POOL_SIZE: "5"
  DATABASE_URL: ecto://relay_worker@work-postgres:5432/relay
  DATABASE_PASSWORD_FILE: /run/secrets/relay-db-password
  QUEUE_DATABASE_URL: ecto://relay_queue@work-postgres:5432/relay
  QUEUE_DATABASE_PASSWORD_FILE: /run/secrets/relay-db-password
  MAINT_DATABASE_URL: ecto://relay_maint@work-postgres:5432/relay
  MAINT_DATABASE_PASSWORD_FILE: /run/secrets/relay-db-password
  VALKEY_URL: redis://valkey:6379
  SECRET_KEY_BASE_FILE: /run/secrets/relay-secret-key-base
  PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
  PKCS11_TOKEN: relay-dev
  PKCS11_PIN_FILE: /run/secrets/relay-hsm-pin
  KEY_STORE_KEK_LABEL: relay-kek
  KEY_STORE_FINGERPRINT_LABEL: relay-fingerprint
  KEY_STORE_CURSOR_LABEL: relay-cursor
  AUDIT_S3_ENDPOINT: http://s3:7070
  AUDIT_S3_BUCKET: relay-audit
  AUDIT_S3_REGION: us-east-1
  AUDIT_S3_ACCESS_KEY_ID: work-dev
  AUDIT_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/relay-s3-secret

# T-99, T-96, E-4
x-access-suiss: &access-suiss '{region="eu", relay="https://relay", management_api="https://access-server:8443", products={work="https://work:8443"}}'


services:
  # T-20, T-36, T-51
  work-postgres:
    <<: *hardening
    image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18.6-trixie
    user: "999:999"
    read_only: true
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999
      - /tmp:uid=999,gid=999
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only-not-a-secret
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256 --data-checksums
      WORK_DB_PASSWORD: local-only-not-a-secret
      ACCESS_OWNER_PASSWORD: local-only-not-a-secret
      ACCESS_APP_PASSWORD: local-only-not-a-secret
      RELAY_OWNER_PASSWORD: local-only-not-a-secret
      RELAY_APP_PASSWORD: local-only-not-a-secret
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ../../crates/store/bootstrap:/work-bootstrap:ro
    ports:
      - "127.0.0.1:${WORK_DEV_PG_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "relay"]
      interval: 2s
      timeout: 3s
      retries: 30

  # T-20, T-51
  nats:
    <<: *hardening
    image: nats@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4 # 2.15.0-alpine
    user: "65532:65532"
    read_only: true
    command: ["--config", "/etc/nats/nats.conf"]
    tmpfs:
      - /data:uid=65532,gid=65532
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "127.0.0.1:${WORK_DEV_NATS_PORT:-4232}:4222"
      - "127.0.0.1:${WORK_DEV_NATS_MONITOR_PORT:-8232}:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 30

  # T-20, OP-2, OP-33, OP-45, OP-46
  s3:
    <<: *hardening
    image: versity/versitygw@sha256:eb7f786fcd91e72194e48fcf1ac16302d686bf8e3a71434bdbc067a6efd3fdc7 # v1.9.0
    read_only: true
    command: ["--port", ":7070", "posix", "/data"]
    volumes:
      - s3data:/data
    environment:
      ROOT_ACCESS_KEY: work-dev
      ROOT_SECRET_KEY: local-only-not-a-secret
    ports:
      - "127.0.0.1:${WORK_DEV_S3_PORT:-7072}:7070"

  # T-56
  softhsm:
    <<: *hardening
    build: ./softhsm
    image: work-dev/softhsm:local
    read_only: true
    environment:
      SOFTHSM_TOKEN_LABEL: work-dev
      SOFTHSM_SO_PIN: "12345678"
      SOFTHSM_USER_PIN: "1234"
    volumes:
      - softhsm:/var/lib/softhsm/tokens
    healthcheck:
      test: ["CMD-SHELL", "softhsm2-util --show-slots | grep -q 'Label:.*work-dev'"]
      interval: 2s
      timeout: 5s
      retries: 30

  # T-7, T-10, T-56, T-72
  work-signer:
    <<: *hardening
    build:
      context: ../..
      dockerfile: deploy/compose/work/Dockerfile
      target: signer
    image: work-dev/work-signer:local
    read_only: true
    environment:
      SOFTHSM_TOKEN_LABEL: work-dev
      SOFTHSM_USER_PIN: "1234"
      WORK_SIGNER_KEY_LABEL: work.log.v1
      WORK_SIGNER_PIN_FILE: /run/work-signer-pin/pin
    tmpfs:
      - /run/work-signer-pin:uid=65532,gid=65532,mode=0700
    volumes:
      - softhsm:/var/lib/softhsm/tokens
      - signer-socket:/run/work-signer
      - ./work/signer.toml:/etc/work-signer/signer.toml:ro
    depends_on:
      softhsm:
        condition: service_healthy
      work-server-tls:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-S", "/run/work-signer/signer.sock"]
      interval: 2s
      timeout: 3s
      retries: 60

  # T-36, OP-28
  work-migrate:
    <<: *access-hardening
    build:
      context: ../..
      dockerfile: deploy/compose/work/Dockerfile
      target: cli
    image: work-dev/work-cli:local
    read_only: true
    entrypoint: ["sh", "-c"]
    command: ["work-cli migrate canonical && work-cli migrate derived"]
    environment:
      PGHOST: work-postgres
      PGPORT: "5432"
      PGUSER: work_owner
      PGPASSWORD: local-only-not-a-secret
    depends_on:
      work-postgres:
        condition: service_healthy

  # T-39, T-84, T-20, OP-33, T-76, T-96, E-2, T-101, T-102, T-103
  work-server:
    <<: *hardening
    build:
      context: ../..
      dockerfile: deploy/compose/work/Dockerfile
      target: server
    image: work-dev/work-server:local
    user: "65532:65532"
    group_add: ["65532"]
    read_only: true
    environment:
      WORK_CONFIG: /etc/work/work-server.toml
      WORK_LISTEN: 0.0.0.0:8090
      WORK_INTERNAL_LISTEN: 0.0.0.0:8091
      PGPASSWORD: local-only-not-a-secret
      NATS_USER: work
      NATS_PASSWORD: local-only-not-a-secret
      AWS_ACCESS_KEY_ID: work-dev
      AWS_SECRET_ACCESS_KEY: local-only-not-a-secret
    volumes:
      - signer-socket:/run/work-signer
      - ./work-server.toml:/etc/work/work-server.toml:ro
      - ./nts/pki/root.pem:/etc/work/nts-root.pem:ro
      - witness-public:/run/witness:ro
      - access-product-tls:/var/lib/access/product-tls:ro
      - softhsm:/var/lib/softhsm/tokens
      - work-access-client:/run/work-access:ro
    secrets:
      - source: work_access_pin
        target: /run/secrets/access-pin
    ports:
      - "127.0.0.1:${WORK_DEV_SERVER_PORT:-8190}:8090"
      - "127.0.0.1:${WORK_DEV_SERVER_INTERNAL_PORT:-8191}:8091"
    networks: [default, access]
    depends_on:
      work-postgres:
        condition: service_healthy
      work-migrate:
        condition: service_completed_successfully
      work-server-tls:
        condition: service_completed_successfully
      work-access-client-id:
        condition: service_completed_successfully
      access:
        condition: service_healthy
      nats:
        condition: service_healthy
      work-signer:
        condition: service_healthy
      s3:
        condition: service_started
      nts-a:
        condition: service_healthy
      nts-b:
        condition: service_healthy
      roughtime-a:
        condition: service_started
      roughtime-b:
        condition: service_started
      roughtime-c:
        condition: service_started
      witness:
        condition: service_healthy
      relay:
        condition: service_healthy

  # OP-33, OP-46, T-41
  witness:
    <<: *hardening
    build: ./witness
    image: work-dev/witness:local
    read_only: true
    environment:
      WITNESS_NAME: witness.localhost
    tmpfs:
      - /var/lib/litewitness:uid=65532,gid=65532
      - /run/litewitness:uid=65532,gid=65532
    volumes:
      - witness-public:/run/litewitness-public
    ports:
      - "127.0.0.1:${WORK_DEV_WITNESS_PORT:-7390}:7380"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7380"]
      interval: 2s
      timeout: 3s
      retries: 30

  # OP-32, T-41
  nts-a:
    <<: *hardening
    build: ./nts
    image: work-dev/nts:local
    read_only: true
    command:
      - port 11123
      - ntsport 14460
      - ntsserverkey /etc/chrony/nts/server.key
      - ntsservercert /etc/chrony/nts/server.pem
      - local stratum 1
      - allow
      - cmdport 0
      - bindcmdaddress /
      - pidfile /
    ports:
      - "127.0.0.1:11123:11123/udp"
      - "127.0.0.1:14460:14460"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/14460"]
      interval: 2s
      timeout: 3s
      retries: 30

  nts-b:
    <<: *hardening
    build: ./nts
    image: work-dev/nts:local
    read_only: true
    command:
      - port 11124
      - ntsport 14461
      - ntsserverkey /etc/chrony/nts/server.key
      - ntsservercert /etc/chrony/nts/server.pem
      - local stratum 1
      - allow
      - cmdport 0
      - bindcmdaddress /
      - pidfile /
    ports:
      - "127.0.0.1:11124:11124/udp"
      - "127.0.0.1:14461:14461"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/14461"]
      interval: 2s
      timeout: 3s
      retries: 30

  # OP-42, OP-43, T-41
  roughtime-a:
    <<: *hardening
    build: ./roughtime
    image: work-dev/roughtime:local
    read_only: true
    environment:
      ROUGHENOUGH_SEED_FILE: /etc/roughenough/a-test-only.seed
      ROUGHENOUGH_NUM_THREADS: "1"
    ports:
      - "127.0.0.1:${WORK_DEV_ROUGHTIME_A_PORT:-15319}:5319/udp"

  roughtime-b:
    <<: *hardening
    build: ./roughtime
    image: work-dev/roughtime:local
    read_only: true
    environment:
      ROUGHENOUGH_SEED_FILE: /etc/roughenough/b-test-only.seed
      ROUGHENOUGH_NUM_THREADS: "1"
    ports:
      - "127.0.0.1:${WORK_DEV_ROUGHTIME_B_PORT:-15320}:5319/udp"

  roughtime-c:
    <<: *hardening
    build: ./roughtime
    image: work-dev/roughtime:local
    read_only: true
    environment:
      ROUGHENOUGH_SEED_FILE: /etc/roughenough/c-test-only.seed
      ROUGHENOUGH_NUM_THREADS: "1"
    ports:
      - "127.0.0.1:${WORK_DEV_ROUGHTIME_C_PORT:-15321}:5319/udp"

  # T-57, SEC-35
  otel-collector:
    <<: *hardening
    image: otel/opentelemetry-collector-contrib@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6 # 0.162.0
    user: "10001:10001"
    read_only: true
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${WORK_DEV_OTLP_GRPC_PORT:-4327}:4317"
      - "127.0.0.1:${WORK_DEV_OTLP_HTTP_PORT:-4328}:4318"
    depends_on:
      jaeger:
        condition: service_healthy

  jaeger:
    <<: *hardening
    image: jaegertracing/jaeger@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8 # 2.20.0
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    ports:
      - "127.0.0.1:${WORK_DEV_JAEGER_UI_PORT:-16696}:16686"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:13133/status"]
      interval: 2s
      timeout: 3s
      retries: 30

  prometheus:
    <<: *hardening
    image: prom/prometheus@sha256:b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01 # v3.15.0-distroless
    user: "65532:65532"
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
    tmpfs:
      - /prometheus:uid=65532,gid=65532
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${WORK_DEV_PROMETHEUS_PORT:-9099}:9090"
    healthcheck:
      test: ["CMD", "promtool", "check", "healthy", "--url=http://127.0.0.1:9090"]
      interval: 2s
      timeout: 3s
      retries: 30

  grafana:
    <<: *hardening
    image: grafana/grafana@sha256:83be3e511ede559bee80e2215bb1987cb1246075461cb961beb515b0341e7aea # 12.4.12
    user: "472:0"
    read_only: true
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-only-not-a-secret
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    tmpfs:
      - /var/lib/grafana:uid=472,gid=0
      - /tmp:uid=472,gid=0
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/work.yaml:ro
    ports:
      - "127.0.0.1:${WORK_DEV_GRAFANA_PORT:-3310}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 60

  # T-51, T-41
  access-volume-owners:
    <<: *access-hardening
    image: ghcr.io/e-suiss/access@sha256:1f3eb33a2daa04868e6199c8e69d77a8d287add47d5a926e5911b879ad153859
    platform: linux/amd64
    user: "0:0"
    cap_add: [CHOWN, FOWNER]
    read_only: true
    entrypoint: ["sh", "-c"]
    command:
      - "chown 65532:65532 /var/lib/access/certs /var/lib/access/secrets /var/lib/access/initdb /var/lib/access/signer /var/lib/access/identity-signer /var/lib/access/bootstrap /var/lib/access/products /var/lib/access/product-tls /var/lib/work-access && chmod 0750 /var/lib/access/certs /var/lib/access/secrets /var/lib/access/initdb /var/lib/access/signer /var/lib/access/identity-signer /var/lib/access/bootstrap /var/lib/access/products /var/lib/access/product-tls /var/lib/work-access && chown 65532:softhsm /var/lib/softhsm/tokens && chmod 0770 /var/lib/softhsm/tokens"
    volumes:
      - access-certs:/var/lib/access/certs
      - access-secrets:/var/lib/access/secrets
      - access-initdb:/var/lib/access/initdb
      - access-softhsm:/var/lib/softhsm/tokens
      - access-signer:/var/lib/access/signer
      - access-identity-signer:/var/lib/access/identity-signer
      - access-bootstrap:/var/lib/access/bootstrap
      - access-products:/var/lib/access/products
      - access-product-tls:/var/lib/access/product-tls
      - work-access-client:/var/lib/work-access
    networks: [access]

  # T-51, T-41, T-101
  access-init:
    <<: *access-process
    image: ghcr.io/e-suiss/access@sha256:1f3eb33a2daa04868e6199c8e69d77a8d287add47d5a926e5911b879ad153859
    command: ["access-local-init"]
    environment:
      ACCESS_LOCAL_PRODUCT_HOSTS: work-server relay
    depends_on:
      access-volume-owners:
        condition: service_completed_successfully
      work-access-keys:
        condition: service_completed_successfully
    volumes:
      - access-products:/etc/access/products:ro
      - access-certs:/var/lib/access/certs
      - access-secrets:/var/lib/access/secrets
      - access-initdb:/var/lib/access/initdb
      - access-softhsm:/var/lib/softhsm/tokens
      - access-signer:/var/lib/access/signer
      - access-identity-signer:/var/lib/access/identity-signer
      - access-product-tls:/var/lib/access/product-tls
    networks: [access]

  # T-51, T-20
  access-postgres:
    <<: *access-hardening
    image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18.6-trixie
    user: "999:999"
    group_add: ["65532"]
    read_only: true
    entrypoint:
      - sh
      - -c
      - "install -m 0600 /docker-entrypoint-initdb.d/postgres.key /var/run/postgresql/server.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_min_protocol_version=TLSv1.3 -c ssl_cert_file=/var/lib/access/certs/postgres.crt -c ssl_key_file=/var/run/postgresql/server.key"
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999
      - /tmp:uid=999,gid=999
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /docker-entrypoint-initdb.d/superuser
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256 --data-checksums
    volumes:
      - access-pgdata:/var/lib/postgresql
      - access-certs:/var/lib/access/certs:ro
      - access-initdb:/docker-entrypoint-initdb.d:ro
    depends_on:
      access-init:
        condition: service_completed_successfully
    networks:
      access:
        aliases: [postgres]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "access"]
      interval: 2s
      timeout: 3s
      retries: 60

  # T-51, T-36
  access-migrate:
    <<: *access-process
    image: ghcr.io/e-suiss/access@sha256:1f3eb33a2daa04868e6199c8e69d77a8d287add47d5a926e5911b879ad153859
    command: ["access-server", "migrate"]
    environment:
      ACCESS_CONFIG: /etc/access/local/access.toml
      ACCESS_SUISS: *access-suiss
    volumes:
      - access-certs:/var/lib/access/certs:ro
      - access-secrets:/var/lib/access/secrets:ro
    depends_on:
      access-postgres:
        condition: service_healthy
    networks: [access]

  # T-51, T-56
  access-signer:
    <<: *access-process
    image: ghcr.io/e-suiss/access@sha256:1f3eb33a2daa04868e6199c8e69d77a8d287add47d5a926e5911b879ad153859
    command: ["access-signer"]
    restart: unless-stopped
    environment:
      ACCESS_SIGNER_CONFIG: /etc/access/local/access-signer.toml
    volumes:
      - access-secrets:/var/lib/access/secrets:ro
      - access-softhsm:/var/lib/softhsm/tokens
      - access-signer:/var/lib/access/signer
      - access-sockets:/run/access
    depends_on:
      access-init:
        condition: service_completed_successfully
    networks: [access]
    healthcheck:
      test: ["CMD", "test", "-S", "/run/access/signer.sock"]
      interval: 2s
      timeout: 3s
      retries: 30

  # T-51, T-56
  access-identity-signer:
    <<: *access-process
    image: ghcr.io/e-suiss/access@sha256:1f3eb33a2daa04868e6199c8e69d77a8d287add47d5a926e5911b879ad153859
    command: ["access-identity-signer"]
    restart: unless-stopped
    environment:
      ACCESS_IDENTITY_SIGNER_CONFIG: /etc/access/local/access-identity-signer.toml
    volumes:
      - access-secrets:/var/lib/access/secrets:ro
      - access-softhsm:/var/lib/softhsm/tokens
      - access-identity-signer:/var/lib/access/identity-signer
      - access-sockets:/run/access
    depends_on:
      access-init:
        condition: service_completed_successfully
    networks: [access]
    healthcheck:
      test: ["CMD", "test", "-S", "/run/access/identity-signer.sock"]
      interval: 2s
      timeout: 3s
      retries: 30

  # T-56, T-101, T-103
  work-access-keys:
    <<: *access-hardening
    build: ./softhsm
    image: work-dev/softhsm:local
    read_only: true
    entrypoint: ["/usr/local/bin/work-access-keys"]
    environment:
      SOFTHSM_TOKEN_LABEL: work-dev
      SOFTHSM_USER_PIN: "1234"
      WORK_ACCESS_KEYS: /var/lib/work-access/products
    tmpfs:
      - /tmp:uid=65532,gid=65532
    volumes:
      - softhsm:/var/lib/softhsm/tokens
      - access-products:/var/lib/work-access/products
    depends_on:
      softhsm:
        condition: service_healthy
      access-volume-owners:
        condition: service_completed_successfully

  # T-56, T-101
  work-access-pep:
    <<: *access-hardening
    build: ./softhsm
    image: work-dev/softhsm:local
    read_only: true
    entrypoint: ["/usr/local/bin/work-access-pep"]
    group_add: ["65532"]
    environment:
      SOFTHSM_TOKEN_LABEL: work-dev
      SOFTHSM_USER_PIN: "1234"
      WORK_PEP_CERTIFICATE: /var/lib/access/product-tls/work-pep.crt
    tmpfs:
      - /tmp:uid=65532,gid=65532
    volumes:
      - softhsm:/var/lib/softhsm/tokens
      - access-product-tls:/var/lib/access/product-tls:ro
    depends_on:
      access-init:
        condition: service_completed_successfully

  # T-56, T-102
  work-server-tls:
    <<: *access-hardening
    build: ./softhsm
    image: work-dev/softhsm:local
    read_only: true
    entrypoint: ["/usr/local/bin/work-server-tls"]
    group_add: ["65532"]
    environment:
      SOFTHSM_TOKEN_LABEL: work-dev
      SOFTHSM_USER_PIN: "1234"
      WORK_SERVER_KEY: /var/lib/access/product-tls/work-server.key
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700
    volumes:
      - softhsm:/var/lib/softhsm/tokens
      - access-product-tls:/var/lib/access/product-tls:ro
    depends_on:
      access-init:
        condition: service_completed_successfully
      softhsm:
        condition: service_healthy
      work-access-pep:
        condition: service_completed_successfully

  # T-96, T-103
  work-access-client-id:
    <<: *access-hardening
    build: ./softhsm
    image: work-dev/softhsm:local
    read_only: true
    entrypoint: ["sh", "-c"]
    command:
      - "jq -er '.clients[] | select(.product == \"work\") | .client_id' /var/lib/access/bootstrap/bootstrap.json > /run/work-access/client_id.new && mv /run/work-access/client_id.new /run/work-access/client_id && cat /run/work-access/client_id"
    volumes:
      - access-bootstrap:/var/lib/access/bootstrap:ro
      - work-access-client:/run/work-access
    depends_on:
      access-bootstrap:
        condition: service_completed_successfully

  # T-96, T-101, T-103, T-51, T-102, T-104
  access-bootstrap:
    <<: *access-process
    image: ghcr.io/e-suiss/access@sha256:1f3eb33a2daa04868e6199c8e69d77a8d287add47d5a926e5911b879ad153859
    entrypoint: ["sh", "-c"]
    command:
      - "access-server bootstrap /etc/work-access/bootstrap-work.toml > /var/lib/access/bootstrap/bootstrap.json && cat /var/lib/access/bootstrap/bootstrap.json"
    environment:
      ACCESS_CONFIG: /etc/access/local/access.toml
      ACCESS_SUISS: *access-suiss
      ACCESS_DELIVERY_TARGETS: '[{url="https://work-server:8443/v1/inbound/events", ca_file="/var/lib/access/certs/ca.crt"}]'
      BOOTSTRAP_TEST_PASSWORD: ${ACCESS_LOCAL_TEST_PASSWORD:-local-only-not-a-secret}
    volumes:
      - access-certs:/var/lib/access/certs:ro
      - access-secrets:/var/lib/access/secrets:ro
      - access-softhsm:/var/lib/softhsm/tokens
      - access-sockets:/run/access
      - access-bootstrap:/var/lib/access/bootstrap
      - access-products:/etc/access/products:ro
      - ./access/bootstrap-work.toml:/etc/work-access/bootstrap-work.toml:ro
      - ./access/bootstrap-work-beta.toml:/etc/work-access/bootstrap-work-beta.toml:ro
      - relay-access-keys:/etc/relay-access:ro
    depends_on:
      access-migrate:
        condition: service_completed_successfully
      access-signer:
        condition: service_healthy
      access-identity-signer:
        condition: service_healthy
      work-access-pep:
        condition: service_completed_successfully
      relay-keys:
        condition: service_completed_successfully
    networks: [access]

  # T-51, E-2, MD-3, T-96, T-101
  access:
    <<: *access-process
    image: ghcr.io/e-suiss/access@sha256:1f3eb33a2daa04868e6199c8e69d77a8d287add47d5a926e5911b879ad153859
    command: ["access-server"]
    restart: unless-stopped
    environment:
      ACCESS_CONFIG: /etc/access/local/access.toml
      ACCESS_SUISS: *access-suiss
      ACCESS_DELIVERY_TARGETS: '[{url="https://work-server:8443/v1/inbound/events", ca_file="/var/lib/access/certs/ca.crt"}]'
    volumes:
      - access-certs:/var/lib/access/certs:ro
      - access-secrets:/var/lib/access/secrets:ro
      - access-softhsm:/var/lib/softhsm/tokens
      - access-sockets:/run/access
      - access-bootstrap:/var/lib/access/bootstrap:ro
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      access-bootstrap:
        condition: service_completed_successfully
    networks:
      access:
        aliases: [access-server]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/var/lib/access/certs/ca.crt", "https://localhost:8443/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    <<: *hardening
    image: axllent/mailpit@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d # v1.31.3
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532
    ports:
      - "127.0.0.1:${WORK_DEV_SMTP_PORT:-1035}:1025"
      - "127.0.0.1:${WORK_DEV_MAIL_UI_PORT:-8035}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # T-56, T-41, T-99
  relay-keys:
    <<: *relay-process
    build: ./relay
    image: work-dev/relay:local
    entrypoint: ["/usr/local/bin/relay-keys"]
    environment:
      <<: *relay-env
      SOFTHSM_SO_PIN: "12345678"
      LOCAL_ACCESS_KEYS: /var/lib/relay-access
    volumes:
      - relay-softhsm:/var/lib/relay-softhsm
      - relay-access-keys:/var/lib/relay-access

  # T-51, T-16, T-36, OP-28, MD-3, T-99
  relay-init:
    <<: *relay-process
    build: ./relay
    image: work-dev/relay:local
    entrypoint: ["/usr/local/bin/relay-init"]
    environment:
      <<: *relay-env
      RELAY_ROLES: worker
      RELAY_REGION: eu
      ADMIN_DATABASE_URL: ecto://postgres@work-postgres:5432/relay
      ADMIN_DATABASE_PASSWORD_FILE: /run/secrets/relay-db-password
      LOCAL_MIGRATOR_DATABASE_URL: ecto://relay_migrator@work-postgres:5432/relay
      LOCAL_BOOTSTRAP: /var/lib/access/bootstrap/bootstrap.json
      LOCAL_ACCESS_CA: /var/lib/access/product-tls/ca.crt
      LOCAL_TRUST: /var/lib/relay-trust
    volumes:
      - access-bootstrap:/var/lib/access/bootstrap:ro
      - access-product-tls:/var/lib/access/product-tls:ro
      - relay-trust:/var/lib/relay-trust
      - relay-access-client:/var/lib/relay-client
    depends_on:
      work-postgres:
        condition: service_healthy
      s3:
        condition: service_started
      access-bootstrap:
        condition: service_completed_successfully
      relay-keys:
        condition: service_completed_successfully
    networks: [default, access]

  # T-51, T-16, MD-3, E-2, T-99, T-41
  relay:
    <<: *relay-process
    build: ./relay
    image: work-dev/relay:local
    restart: unless-stopped
    command: ["start"]
    environment:
      <<: *relay-env
      LOCAL_TLS_CERT: /var/lib/access/product-tls/relay.crt
      LOCAL_TLS_KEY: /var/lib/access/product-tls/relay.key
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - relay-softhsm:/var/lib/relay-softhsm
      - relay-trust:/var/lib/relay-trust:ro
      - relay-access-client:/var/lib/relay-client:ro
      - access-product-tls:/var/lib/access/product-tls:ro
    ports:
      - "127.0.0.1:${WORK_DEV_RELAY_PORT:-4010}:4000"
      - "127.0.0.1:443:443"
    depends_on:
      relay-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [default, access]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/readyz"]
      interval: 2s
      timeout: 3s
      retries: 120

  valkey:
    <<: *hardening
    image: valkey/valkey@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11 # 9.1.2-alpine
    user: "999:1000"
    read_only: true
    command: ["valkey-server", "--maxmemory-policy", "noeviction", "--appendonly", "no"]
    tmpfs:
      - /data:uid=999,gid=1000
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  s3data:
  softhsm:
  signer-socket:
  witness-public:
  access-certs:
  access-secrets:
  access-initdb:
  access-pgdata:
  access-softhsm:
  access-signer:
  access-identity-signer:
  access-sockets:
  access-bootstrap:
  access-products:
  access-product-tls:
  work-access-client:
  relay-softhsm:
  relay-access-keys:
  relay-access-client:
  relay-trust:

networks:
  default:
  access:

secrets:
  relay_db_password:
    file: ./relay/db-password
  relay_s3_secret:
    file: ./relay/s3-secret
  relay_secret_key_base:
    file: ./relay/secret-key-base
  relay_hsm_pin:
    file: ./relay/hsm-pin
  work_access_pin:
    file: ./work/access-pin
