# T-96, T-101, T-102, T-103
platform = "platform"
tenants = ["acme", "beta"]
issuer_style = "path"

# T-101, E-45
[sample]
realm = "acme"
namespace = "work"
action = "approve"
allowed = "commit"
resource_namespace = "work.ledger"
resource_path_prefix = "led_"

# T-104, T-102
[test_user]
realm = "acme"
identifier = "test@acme.example"
password_env = "BOOTSTRAP_TEST_PASSWORD"
client_display_name = "Local test client"
redirect_uri = "http://127.0.0.1/cb"

# T-102
[compromise]
realm = "acme"

[[products]]
product = "work"
display_name = "Suiss Work"
client_key = "/etc/access/products/work-client.jwk"
service_key = "/etc/access/products/work-service.jwk"
redirect_uri = "http://127.0.0.1:8190/v1/access/approval"
event_receiver = "https://work-server:8443/v1/inbound/events"

# T-99
[[products]]
product = "relay"
display_name = "Suiss Relay"
client_key = "/etc/relay-access/relay-client.jwk"
service_key = "/etc/relay-access/relay-service.jwk"
redirect_uri = "https://relay.localhost/v1/access/approval"
event_receiver = "https://relay/v1/access/events"
